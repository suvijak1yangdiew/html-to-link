<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="งบวันนี้"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0E191B"/>
<title>งบวันนี้ · Personal Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ╔══════════════════════════════════════════════╗
   ║  RESET & BASE                                ║
   ╚══════════════════════════════════════════════╝ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden}
body{
  font-family:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",-apple-system,
    BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--t1);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
input,button,select{font-family:inherit}
button{cursor:pointer}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:2px solid var(--vl);outline-offset:2px;border-radius:8px}

/* ── Mobile-friendly date input ── */
.fi-inp[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  min-height:34px;
  cursor:pointer;
  position:relative;
  display:block;
  color:var(--t1);
  color-scheme:dark;
}
/* ทำให้ทั้งช่อง input เป็นพื้นที่ tap → เปิดปฏิทินได้ทุกจุด (Chrome/Android) */
.fi-inp[type="date"]::-webkit-calendar-picker-indicator{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  padding:0;margin:0;
  opacity:0;
  cursor:pointer;
  background:transparent;
  -webkit-appearance:none;
}
/* แสดง placeholder เป็นสี medium grey เมื่อยังไม่ได้เลือก (iOS Safari) */
.fi-inp[type="date"]:not(.has-value)::-webkit-datetime-edit{
  color:var(--t3);
}
.fi-inp[type="date"].has-value::-webkit-datetime-edit{
  color:var(--t1);
}
/* ให้ label แถวนี้คลิกได้ → เปิดปฏิทิน */
.fi.date-row{cursor:pointer}
.fi.date-row .fl{cursor:pointer}

::-webkit-scrollbar{width:0;height:0}

/* ╔══════════════════════════════════════════════╗
   ║  DESIGN TOKENS                               ║
   ╚══════════════════════════════════════════════╝ */
:root{
  color-scheme:dark;
  /* Surfaces */
  --bg:      #091113;
  --s1:      #0E191B;
  --s2:      #122124;
  --s3:      #182B2F;
  --s4:      #20383D;
  --glass:   rgba(255,255,255,0.04);
  /* Borders */
  --b1:      rgba(255,255,255,0.07);
  --b2:      rgba(255,255,255,0.12);
  --b3:      rgba(255,255,255,0.20);
  /* Accent (mint) */
  --vc:      #2DD4BF;  /* mint core */
  --vl:      #5EEAD4;  /* mint light */
  --vs:      rgba(45,212,191,0.12);
  --vb:      rgba(45,212,191,0.32);
  --on-acc:  #042F2A;  /* text on mint */
  /* Semantic */
  --g:       #4ADE80;  --gs:rgba(74,222,128,0.10);  --gb:rgba(74,222,128,0.30); --gl:#86EFAC;
  --a:       #FBBF24;  --as:rgba(251,191,36,0.10);  --ab:rgba(251,191,36,0.30);
  --o:       #FB923C;  --os:rgba(251,146,60,0.10);  --ob:rgba(251,146,60,0.30);
  --bl:      #60A5FA;
  --r:       #F87171;  --rs:rgba(248,113,113,0.10); --rb:rgba(248,113,113,0.30);
  /* Type */
  --t1:      #E7F3F0;  --t2:rgba(231,243,240,0.72);  --t3:rgba(231,243,240,0.50);
  /* Radius */
  --rx:      24px;  --rl:18px;  --rm:14px;  --rs2:10px;
  /* Nav */
  --nav:     64px;
  /* Layout */
  --maxw:    560px;
  /* Shadows */
  --sh-v:    0 10px 36px rgba(45,212,191,0.14);
  --sh-g:    0 10px 30px rgba(74,222,128,0.12);
  --sh-card: 0 1px 0 rgba(255,255,255,0.03) inset, 0 4px 18px rgba(0,0,0,0.35);
}

/* ╔══════════════════════════════════════════════╗
   ║  APP SHELL                                   ║
   ╚══════════════════════════════════════════════╝ */
#app{
  display:flex;flex-direction:column;
  height:100%;height:100dvh;
  position:relative;
  background:
    radial-gradient(900px 420px at 50% -120px,rgba(45,212,191,0.08),transparent 70%),
    var(--bg);
}
/* Header */
#hdr{
  flex-shrink:0;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:calc(env(safe-area-inset-top) + 14px) max(20px,calc((100% - var(--maxw))/2 + 20px)) 12px;
  background:rgba(14,25,27,0.88);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--b1);
  position:relative;z-index:50;
}
#hdr-left{}
#hdr-logo{
  font-size:.8rem;font-weight:700;letter-spacing:.04em;
  color:var(--vl);display:flex;align-items:center;gap:7px;
}
#hdr-logo .mark{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--vl),var(--vc));color:var(--on-acc);
}
#hdr-logo .mark svg{width:14px;height:14px}
#hdr-greet{font-size:1.05rem;font-weight:700;color:var(--t1);margin-top:3px}
#hdr-right{text-align:right}
#hdr-date{font-size:.78rem;color:var(--t2)}
#salary-chip{
  display:inline-flex;align-items:center;gap:4px;margin-top:4px;
  background:var(--vs);border:1px solid var(--vb);
  border-radius:20px;padding:4px 11px;
  font-size:.74rem;font-weight:600;color:var(--vl);
}
/* Content */
#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  overscroll-behavior:contain;
}
/* Tab panes */
.pane{display:none;animation:paneIn .22s cubic-bezier(.4,0,.2,1) both}
.pane.on{display:block}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.w{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* Bottom Nav */
#nav{
  flex-shrink:0;
  display:flex;
  background:rgba(14,25,27,0.92);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--b1);
  padding:0 max(4px,calc((100% - var(--maxw))/2)) env(safe-area-inset-bottom);
  height:calc(var(--nav) + env(safe-area-inset-bottom));
  position:relative;z-index:50;
}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;min-height:44px;
  background:none;border:none;cursor:pointer;
  color:var(--t3);font-family:inherit;
  padding:6px 2px;position:relative;transition:color .2s;
}
.nb.on{color:var(--vl)}
.nb-ico{
  line-height:1;position:relative;
  display:grid;place-items:center;
  width:52px;height:30px;border-radius:99px;
  transition:background .2s;
}
.nb-ico svg{width:22px;height:22px}
.nb.on .nb-ico{background:var(--vs)}
.nb-lbl{font-size:.7rem;font-weight:600;letter-spacing:.01em}
.nb-dot{
  position:absolute;top:1px;right:10px;
  width:8px;height:8px;border-radius:50%;
  background:var(--r);border:2px solid var(--s1);
  display:none;
}
.nb-dot.show{display:block}

/* ╔══════════════════════════════════════════════╗
   ║  SHARED COMPONENTS                           ║
   ╚══════════════════════════════════════════════╝ */

/* Section header */
.sh{
  display:flex;align-items:center;gap:10px;
  font-size:.74rem;font-weight:700;letter-spacing:.06em;
  color:var(--t2);
  margin:24px 0 10px;
}
.sh::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--vc);flex-shrink:0}
.sh:empty::before{display:none}
.sh::after{content:'';flex:1;height:1px;background:var(--b1)}
.sh-first{margin-top:20px}

/* ── HERO CARD (balance/budget) */
.hc{
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(94,234,212,0.20) 0%,transparent 55%),
    linear-gradient(150deg,#0F3833 0%,#0C2826 50%,#0A1B1C 100%);
  border:1px solid var(--vb);border-radius:var(--rx);
  padding:22px 20px 16px;box-shadow:var(--sh-v);
  position:relative;overflow:hidden;
}
.hc::after{
  content:'';position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;
  border-radius:50%;pointer-events:none;
  border:1px solid rgba(94,234,212,0.10);
  box-shadow:0 0 0 28px rgba(94,234,212,0.03);
}
.hc-lbl{
  font-size:.78rem;font-weight:600;
  letter-spacing:.03em;color:rgba(153,246,228,0.85);margin-bottom:8px;
}
.hc-val{
  font-size:2.9rem;font-weight:700;color:var(--t1);
  letter-spacing:-.03em;line-height:1.05;transition:all .3s;
}
.hc-val .cu{font-size:1.05rem;font-weight:500;margin-left:5px;opacity:.6}
.hc-foot{
  display:flex;margin-top:16px;padding-top:13px;
  border-top:1px solid rgba(94,234,212,0.16);
  position:relative;z-index:1;
}
.hf{flex:1;text-align:center}
.hf .v{font-size:.95rem;font-weight:700;color:var(--t1)}
.hf .l{font-size:.72rem;color:rgba(153,246,228,0.70);margin-top:3px}
.hf-d{width:1px;background:rgba(94,234,212,0.16);flex-shrink:0}

/* ── SAVINGS HERO CARD */
.shc{
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(74,222,128,0.16) 0%,transparent 55%),
    linear-gradient(150deg,#0F2E1C 0%,#0B2217 50%,#08160F 100%);
  border:1px solid var(--gb);border-radius:var(--rx);
  padding:22px 20px 16px;box-shadow:var(--sh-g);
  position:relative;overflow:hidden;
}
.shc-lbl{font-size:.78rem;font-weight:600;
  letter-spacing:.03em;color:rgba(134,239,172,.85);margin-bottom:8px}
.shc-pct{font-size:2.9rem;font-weight:700;color:var(--g);letter-spacing:-.03em;line-height:1.05}
.shc-pct .cu{font-size:1.05rem;font-weight:500;margin-left:3px;opacity:.6}
.shc-track{
  background:rgba(74,222,128,.12);border-radius:99px;
  height:10px;overflow:hidden;margin:16px 0 7px;position:relative;
}
.shc-fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--g) 0%,var(--gl) 100%);
  transition:width .8s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.shc-milestone{
  position:absolute;top:0;bottom:0;width:1.5px;
  background:rgba(255,255,255,.18);pointer-events:none;
}
.shc-foot{
  display:flex;margin-top:12px;padding-top:12px;
  border-top:1px solid rgba(74,222,128,.14);
}
.shf{flex:1;text-align:center}
.shf .v{font-size:.92rem;font-weight:700;color:var(--t1)}
.shf .l{font-size:.72rem;color:rgba(134,239,172,.70);margin-top:3px}
.shf-d{width:1px;background:rgba(74,222,128,.16);flex-shrink:0}

/* ── STAT CARD */
.sc{
  background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--rl);padding:14px 15px;
  box-shadow:var(--sh-card);min-width:0;
}
.sc.hi{background:var(--vs);border-color:var(--vb)}
.sc.gi{background:var(--gs);border-color:var(--gb)}
.sc-lbl{font-size:.75rem;font-weight:600;color:var(--t2);
  margin-bottom:6px;letter-spacing:.01em;
  display:flex;align-items:center;gap:5px}
.sc-val{font-size:1.5rem;font-weight:700;color:var(--t1);
  letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.sc-val .u{font-size:.74rem;font-weight:500;margin-left:3px;opacity:.6}
.sc-val.lg{font-size:1.55rem}
.sc-val.pos{color:var(--g)} .sc-val.war{color:var(--a)} .sc-val.neg{color:var(--r)}
.sc-val.acc{color:var(--vl)}
.sc-sub{font-size:.72rem;color:var(--t3);margin-top:5px;line-height:1.45}

/* ── INPUT PANEL */
.ip{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh-card)}
.fi{
  display:flex;align-items:center;padding:12px 16px 12px 18px;
  border-bottom:1px solid var(--b1);gap:10px;transition:background .15s;
}
.fi:last-child{border-bottom:none}
.fi:focus-within{background:rgba(45,212,191,.06);box-shadow:inset 3px 0 0 var(--vc)}
.fm{flex:1;min-width:0}
.fl{font-size:.76rem;font-weight:600;color:var(--t2);
  margin-bottom:4px;display:flex;align-items:center;gap:6px;letter-spacing:.01em;flex-wrap:wrap}
.fl .ic{font-size:.92rem}
.opt{font-size:.68rem;padding:1px 7px;border-radius:20px;
  background:var(--vs);color:var(--vl);font-weight:600;letter-spacing:.02em}
.fi-inp{
  background:transparent;border:none;outline:none;width:100%;
  font-size:1.35rem;font-weight:600;color:var(--t1);
  font-family:inherit;caret-color:var(--vc);-webkit-appearance:none;
}
.fi-inp:focus-visible{outline:none}
.fi-inp::placeholder{color:rgba(231,243,240,.28);font-weight:400;font-size:1.05rem}
.fi-inp.sm{font-size:1.1rem}
.fu{font-size:.8rem;font-weight:600;color:var(--t3);white-space:nowrap;flex-shrink:0}
.fi-days-badge{
  font-size:.75rem;font-weight:700;padding:4px 11px;border-radius:20px;
  background:var(--vs);color:var(--vl);border:1px solid var(--vb);white-space:nowrap;
}

/* ── PROGRESS BAR */
.pt{background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}
.pf{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1),background .35s}

/* ── SAFETY BANNER */
.sb{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-radius:var(--rl);border:1px solid var(--b1);background:var(--s2);
  transition:all .4s;
}
.sb.safe {background:var(--gs);border-color:var(--gb)}
.sb.tight{background:var(--as);border-color:var(--ab)}
.sb.risky{background:var(--os);border-color:var(--ob)}
.sb.over {background:var(--rs);border-color:var(--rb)}
.sb-ico{flex-shrink:0;line-height:1}
.sb-b{flex:1;min-width:0}
.sb-t{font-size:.92rem;font-weight:700;color:var(--t1);margin-bottom:2px}
.sb-s{font-size:.78rem;color:var(--t2);line-height:1.45}
.sb-badge{font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:20px;
  letter-spacing:.02em;white-space:nowrap;flex-shrink:0}
.sb.safe .sb-badge {background:rgba(74,222,128,.18);color:var(--g)}
.sb.tight .sb-badge{background:rgba(251,191,36,.18);color:var(--a)}
.sb.risky .sb-badge{background:rgba(251,146,60,.18);color:var(--o)}
.sb.over .sb-badge {background:rgba(248,113,113,.18);color:var(--r)}

/* ── MODE BUTTONS */
.mg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.mb{
  background:var(--s2);border:1px solid var(--b1);border-radius:var(--rm);
  padding:12px 6px;cursor:pointer;font-family:inherit;color:var(--t1);
  text-align:center;transition:all .18s;-webkit-appearance:none;
}
.mb:active{transform:scale(.95)}
.mi{font-size:1.25rem;margin-bottom:4px}
.mn{font-size:.72rem;font-weight:700;color:var(--t2);
  letter-spacing:.03em;margin-bottom:3px}
.mv{font-size:1rem;font-weight:700;color:var(--t1)}
.ms2{font-size:.7rem;color:var(--t3);margin-top:3px}
.mb.ms.on{background:var(--gs);border-color:var(--gb)}
.mb.ms.on .mv,.mb.ms.on .mn{color:var(--g)}
.mb.mc.on{background:var(--vs);border-color:var(--vb)}
.mb.mc.on .mv,.mb.mc.on .mn{color:var(--vl)}
.mb.mf.on{background:var(--as);border-color:var(--ab)}
.mb.mf.on .mv,.mb.mf.on .mn{color:var(--a)}

/* ── WARN BANNER */
.wb{background:var(--rs);border:1px solid var(--rb);border-radius:var(--rl);
  padding:14px 16px;display:flex;gap:11px;align-items:flex-start;margin-top:10px}
.wb-i{font-size:1.3rem;flex-shrink:0;margin-top:1px}
.wb-h{font-size:.9rem;font-weight:700;color:var(--r);margin-bottom:3px}
.wb-b{font-size:.8rem;color:rgba(254,202,202,.9);line-height:1.6}

/* ── TREND CARD */
.tc{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:10px;
  border-radius:var(--rl);border:1px solid var(--b1);background:var(--s2);transition:all .3s}
.tc.under {background:var(--gs);border-color:var(--gb)}
.tc.ontrack{background:var(--vs);border-color:var(--vb)}
.tc.over  {background:var(--rs);border-color:var(--rb)}
.tc-i{flex-shrink:0}
.tc-b{flex:1;min-width:0}
.tc-h{font-size:.92rem;font-weight:700;color:var(--t1);margin-bottom:2px}
.tc-s{font-size:.78rem;color:var(--t2);line-height:1.45}
.tc-badge{font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:20px;
  letter-spacing:.02em;white-space:nowrap;background:var(--s4);color:var(--t2)}
.tc.under  .tc-badge{background:rgba(74,222,128,.18);color:var(--g)}
.tc.ontrack .tc-badge{background:var(--vs);color:var(--vl)}
.tc.over   .tc-badge{background:rgba(248,113,113,.18);color:var(--r)}

/* ── LOG CARD */
.lc{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh-card)}
.la{display:flex;align-items:center;padding:14px 18px;
  border-bottom:1px solid var(--b1);gap:10px;transition:background .15s}
.la:focus-within{background:rgba(45,212,191,.06)}
.la-inp{
  background:transparent;border:none;outline:none;flex:1;min-width:0;
  font-size:2.1rem;font-weight:700;color:var(--t1);
  font-family:inherit;caret-color:var(--vc);-webkit-appearance:none;
}
.la-inp::placeholder{color:rgba(231,243,240,.22);font-weight:500;font-size:1.6rem}
.ln{display:flex;align-items:center;padding:10px 18px;
  border-bottom:1px solid var(--b1);gap:8px;transition:background .15s}
.ln:focus-within{background:rgba(45,212,191,.05)}
.ln-inp{
  background:transparent;border:none;outline:none;flex:1;min-width:0;
  font-size:.95rem;color:var(--t1);font-family:inherit;caret-color:var(--vc);
}
.la-inp:focus-visible,.ln-inp:focus-visible{outline:none}
.ln-inp::placeholder{color:rgba(231,243,240,.40)}
.log-btn{
  width:100%;padding:15px;background:var(--vc);border:none;
  border-radius:0;color:var(--on-acc);
  font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:all .18s;
}
.log-btn:active{background:#14B8A6;transform:scale(.99)}

/* ── TODAY CARD */
.tdc{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);padding:15px 16px;box-shadow:var(--sh-card);margin-top:10px}
.sh + .tdc{margin-top:0}
.td-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:8px}
.td-tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.td-tag.ok  {background:var(--gs);color:var(--g)}
.td-tag.over{background:var(--rs);color:var(--r)}
.td-tag.eq  {background:var(--vs);color:var(--vl)}
.td-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;gap:8px}

/* ── HISTORY */
.hd{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.hd-hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px 16px;background:var(--s3);border-bottom:1px solid var(--b1)}
.hd-lbl{font-size:.8rem;font-weight:700;color:var(--t1)}
.hd-tot{font-size:.75rem;font-weight:600;color:var(--t2)}
.he{display:flex;align-items:center;gap:11px;
  padding:9px 10px 9px 16px;border-bottom:1px solid var(--b1)}
.he:last-child{border-bottom:none}
.he-tm{font-size:.72rem;color:var(--t3);width:38px;flex-shrink:0}

.he-am{font-size:.92rem;font-weight:700;color:var(--t1);white-space:nowrap}
.he-dl{background:none;border:none;cursor:pointer;color:var(--t3);

  display:grid;place-items:center}
.he-dl:active{background:var(--rs);color:var(--r)}

/* ── INSIGHTS CHART */
.chart-wrap{padding:15px 14px 11px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);position:relative;box-shadow:var(--sh-card)}
.chart-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px}
.chart-title{font-size:.8rem;font-weight:600;color:var(--t2)}
.chart-legend{display:flex;align-items:center;gap:10px}
.cl-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--t2)}
.cl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:120px;position:relative}
.chart-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0}
.chart-bar-val{font-size:.64rem;color:var(--t2);margin-bottom:3px;height:14px;line-height:14px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.chart-bar{width:100%;max-width:36px;border-radius:6px 6px 2px 2px;min-height:2px;
  transition:height .5s cubic-bezier(.4,0,.2,1)}
.chart-day{font-size:.72rem;font-weight:600;color:var(--t3);margin-top:6px;height:16px;line-height:16px}
.chart-day.td{color:var(--vl)}
.budget-line-wrap{position:absolute;left:0;right:0;pointer-events:none}
.budget-line{height:1px;border-top:1.5px dashed rgba(94,234,212,.5);position:relative}
.budget-line span{position:absolute;right:0;top:-16px;
  font-size:.66rem;color:var(--vl);font-weight:700;
  background:var(--s2);padding:0 4px;border-radius:4px}

/* ── QUICK ADD */
.qa{display:flex;gap:8px}
.qa-btn{flex:1;background:var(--s2);border:1px solid var(--b2);
  border-radius:var(--rm);color:var(--t1);font-size:.9rem;font-weight:700;
  padding:12px 4px;min-height:46px;cursor:pointer;font-family:inherit;transition:all .18s}
.qa-btn:active{background:var(--gs);border-color:var(--gb);color:var(--g);transform:scale(.95)}

/* ── INSIGHT TIP */
.tip{background:var(--s3);border:1px solid var(--b1);border-radius:var(--rl);
  padding:13px 15px;display:flex;gap:11px;align-items:flex-start;margin-top:10px}
.tip-i{font-size:1.05rem;flex-shrink:0;margin-top:1px}
.tip-t{font-size:.84rem;color:var(--t2);line-height:1.65}
.tip-t strong{color:var(--t1);font-weight:700}
.tip.good{background:var(--gs);border-color:var(--gb)}
.tip.warn{background:var(--as);border-color:var(--ab)}
.tip.bad {background:var(--rs);border-color:var(--rb)}

/* ── SETUP PROMPT */
.setup{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rx);
  padding:32px 22px;text-align:center;box-shadow:var(--sh-card)}
.setup-ico{font-size:2.2rem;margin:0 auto 12px;display:grid;place-items:center;
  width:64px;height:64px;border-radius:20px;background:var(--vs)}
.setup-h{font-size:1.05rem;font-weight:700;color:var(--t1);margin-bottom:6px}
.setup-s{font-size:.88rem;color:var(--t2);line-height:1.65;margin-bottom:18px}
.setup-btn{padding:13px 28px;background:var(--vc);border:none;border-radius:var(--rm);
  color:var(--on-acc);font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:var(--sh-v);min-height:46px}
.setup-btn:active{background:#14B8A6}

/* ── GHOST BUTTON */
.ghost{
  width:100%;padding:13px;min-height:46px;background:transparent;border:1px solid var(--b2);
  border-radius:var(--rl);color:var(--t2);font-size:.86rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;
}
.ghost:active{background:var(--rs);border-color:var(--rb);color:var(--r)}

/* ── EMPTY */
.empty{text-align:center;padding:32px 20px;color:var(--t2)}
.empty-i{font-size:2.2rem;margin-bottom:9px;display:block;opacity:.8}
.empty p{font-size:.88rem;line-height:1.7;max-width:240px;margin:0 auto}

/* ── RECENT ENTRIES (overview) */
.re-item{display:flex;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--b1);gap:12px}
.re-item:last-child{border-bottom:none}
.re-dot{width:8px;height:8px;border-radius:50%;background:var(--vc);
  flex-shrink:0;box-shadow:0 0 0 4px var(--vs)}
.re-note{flex:1;min-width:0;font-size:.9rem;color:var(--t1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-note.em{color:var(--t3);font-style:italic}
.re-r{text-align:right;flex-shrink:0}
.re-amt{font-size:.92rem;font-weight:700;color:var(--t1)}
.re-date{font-size:.72rem;color:var(--t3);margin-top:2px}
.more-btn{
  display:block;width:100%;padding:12px;min-height:44px;text-align:center;
  background:none;border:none;border-top:1px solid var(--b1);cursor:pointer;

}

/* ── GRID HELPERS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ── MISC */
.divr{display:flex;align-items:center;gap:9px;margin:2px 0}
.divr-l{flex:1;height:1px;background:var(--b1)}
.divr-t{font-size:.7rem;font-weight:700;color:var(--t3);letter-spacing:.05em}
.pill{

}
.pill.ok  {background:var(--gs);color:var(--g)}
.pill.bad {background:var(--rs);color:var(--r)}
.pill.war {background:var(--as);color:var(--a)}
.pill.neu {background:var(--vs);color:var(--vl)}

.quick-log{
  width:100%;margin-top:10px;padding:14px;min-height:50px;
  background:var(--vc);border:none;border-radius:var(--rl);

  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--sh-v);transition:all .18s;
}
.quick-log .i{font-size:1.2rem}
.quick-log:active{background:#14B8A6;transform:scale(.99)}
@media (hover:hover){.quick-log:hover{background:var(--vl)}}
.top-gap{height:18px}

.hdr-top{display:flex;align-items:center;justify-content:flex-end;gap:8px}
#sync-btn{
  position:relative;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;font-size:1.1rem;
  background:var(--glass);border:1px solid var(--b1);color:var(--t2);cursor:pointer;
}
#sync-btn.on{color:var(--vl);border-color:var(--vb)}
.sync-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--s1);display:none}

.sync-dot.err{display:block;background:var(--r)}

/* ── RECEIPT PHOTO (log form) */
.lp{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--b1)}
.lp-btn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;

  font-size:.86rem;font-weight:600;cursor:pointer}
.lp-btn .i{font-size:1.1rem;color:var(--vl)}
#lp-prev{position:relative;display:flex}
#lp-prev img{width:44px;height:44px;object-fit:cover;border-radius:10px;border:1px solid var(--b2)}
#lp-prev button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;font-size:.8rem;border:none;cursor:pointer;
  background:var(--s4);color:var(--t1)}
.he-ph{background:var(--vs);border:none;cursor:pointer;color:var(--vl);
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:.95rem;flex-shrink:0}

/* ── PHOTO VIEWER */
#viewer{position:fixed;inset:0;z-index:100;background:rgba(3,8,9,.88);
  display:flex;align-items:center;justify-content:center;padding:20px}
#viewer[hidden]{display:none}
.vw-box{max-width:min(560px,100%);width:100%;display:flex;flex-direction:column;gap:12px}

#vw-empty{padding:40px 16px;text-align:center;color:var(--t2);font-size:.9rem;background:var(--s2);border-radius:14px}
.vw-bar{display:flex;gap:10px}

  display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none}
.vw-bar a{background:var(--vc);color:var(--on-acc);border:none}
.vw-bar button{background:var(--s3);color:var(--t1);border:1px solid var(--b2)}
#vw-img[hidden],#vw-empty[hidden],.vw-bar a[hidden]{display:none}

/* ── SETTINGS (Google Sheets) */
.set-p{font-size:.86rem;color:var(--t2);line-height:1.65}
.set-p strong{color:var(--t1)}
.set-inp{width:100%;margin-top:12px;padding:12px 14px;min-height:46px;border-radius:12px;
  background:var(--bg);border:1px solid var(--b2);color:var(--t1);font:inherit;font-size:16px;outline:none}
.set-inp:focus{border-color:var(--vc)}
.set-btn{width:100%;margin-top:10px;min-height:48px;border:none;border-radius:14px;
  background:var(--vc);color:var(--on-acc);font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.set-btn:disabled{opacity:.6;cursor:wait}
.set-msg{margin-top:10px;font-size:.82rem;line-height:1.5}
.set-msg.err{color:var(--r)} .set-msg.ok{color:var(--g)}
.set-link{color:var(--vl);font-weight:600}
.sync-lines{display:flex;flex-direction:column;gap:8px}
.sync-line{display:flex;align-items:flex-start;gap:9px;font-size:.88rem;color:var(--t1);line-height:1.5}
.sync-line .i{font-size:1.05rem;margin-top:.15em;color:var(--g)}
.sync-line.wait .i{color:var(--a)} .sync-line.err .i{color:var(--r)}

.plan{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rl);padding:16px;box-shadow:var(--sh-card);margin-top:10px}
.plan-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:3px;margin-bottom:14px}
.plan-bar span{display:block;min-width:4px}
.plan-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--b1)}
.plan-bar + .plan-row{border-top:none}
.plan-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.plan-tx{flex:1;min-width:0}
.plan-nm{font-size:.92rem;font-weight:700;color:var(--t1)}
.plan-ds{font-size:.74rem;color:var(--t3);margin-top:2px}
.plan-am{text-align:right;flex-shrink:0}
.plan-v{font-size:1.05rem;font-weight:700;color:var(--t1)}
.plan-pc{font-size:.72rem;color:var(--t3);margin-top:1px}
.plan-foot{margin-top:12px;padding-top:12px;border-top:1px solid var(--b1);font-size:.84rem;color:var(--t2);line-height:1.55}
.plan-foot strong{color:var(--t1)}
.plan-btn{width:100%;margin-top:10px;min-height:48px;border-radius:14px;cursor:pointer;
  background:var(--vs);border:1px solid var(--vb);color:var(--vl);font:inherit;font-weight:700;font-size:.92rem;
  display:flex;align-items:center;justify-content:center;gap:8px}
.plan-btn.done{background:var(--gs);border-color:var(--gb);color:var(--g);cursor:default}

/* ── LINE ICONS */
.i{width:1em;height:1em;flex-shrink:0;display:inline-block;vertical-align:-0.15em}
.fl .ic{display:inline-flex;color:var(--vl);font-size:1rem}
.sc-lbl .i{color:var(--vl);font-size:.95rem}
#salary-chip .i{font-size:.9rem}
.sb-ico,.tc-i,.wb-i,.tip-i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
  font-size:1.25rem;background:rgba(255,255,255,.05);color:var(--t2)}
.sb.safe .sb-ico,.tc.under .tc-i,.tip.good .tip-i{color:var(--g);background:rgba(74,222,128,.14)}
.sb.tight .sb-ico,.tip.warn .tip-i{color:var(--a);background:rgba(251,191,36,.14)}
.sb.risky .sb-ico{color:var(--o);background:rgba(251,146,60,.14)}
.sb.over .sb-ico,.tc.over .tc-i,.wb-i,.tip.bad .tip-i{color:var(--r);background:rgba(248,113,113,.14)}
.tc.ontrack .tc-i,.tip .tip-i{color:var(--vl);background:var(--vs)}
.tip.good .tip-i{color:var(--g);background:rgba(74,222,128,.14)}
.tip.bad .tip-i{color:var(--r);background:rgba(248,113,113,.14)}
.tip-i{width:30px;height:30px;border-radius:10px;font-size:1rem;margin-top:0}
.mi{color:var(--t2);display:flex;justify-content:center}
.mb.ms.on .mi{color:var(--g)} .mb.mc.on .mi{color:var(--vl)} .mb.mf.on .mi{color:var(--a)}
.setup-ico{color:var(--vl);font-size:1.8rem}
.empty-i{color:var(--vl)}
.pill .i{font-size:.85rem}
.log-btn .i{font-size:1.15rem}
.ghost .i{font-size:1rem}
.he-dl .i{font-size:1rem}

/* ── DESKTOP HOVER */
@media (hover:hover){
  .nb:hover{color:var(--t1)}
  .nb.on:hover{color:var(--vl)}
  .mb:hover,.qa-btn:hover{border-color:var(--vb);background:var(--s3)}
  .log-btn:hover,.setup-btn:hover{background:var(--vl)}
  .ghost:hover{border-color:var(--b3);color:var(--t1)}
  .he-dl:hover{background:var(--rs);color:var(--r)}
  .more-btn:hover{background:var(--glass)}
}
@media (min-width:768px){
  .hc-val,.shc-pct{font-size:3.2rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<body>

<script>
/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
const DFLT = {
  balance:'', reqSavings:'', salaryDate:'', manualDays:'', targetDaily:'',
  savingGoal:'', savedAmount:'',
  salary:'', emergencySaved:'',
  entries:[], trackerStart:null,
};
let S = {...DFLT};
let TAB = 'home';

const SK = 'bapp_v6';
function ss(){ localStorage.setItem(SK, JSON.stringify(S)); if(SY.url) syncSoon(4000); }
function ls(){
  try{ const r=localStorage.getItem(SK); if(r) S={...DFLT,...JSON.parse(r)}; } catch(e){}
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
const fN = v => { const n=parseFloat(v); return isNaN(n)?0:n; };
const fmt = (n,d=2) => Math.abs(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const fW  = n => Math.round(Math.abs(n)).toLocaleString('th-TH');
const rnd = (n,s) => Math.round(n/s)*s;
const clamp = (n,lo,hi) => Math.min(hi,Math.max(lo,n));
const $  = id => document.getElementById(id);

/* ══════════════════════════════════════════════
   ICONS (line, 24×24)

function todayISO(){ return new Date().toISOString().split('T')[0]; }

function daysUntil(dateStr){
  if(!dateStr) return 0;
  const t = new Date(dateStr+'T00:00:00');
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((t-n)/86400000));
}

function labelDate(ds){
  const t=todayISO();
  const yd=new Date(); yd.setDate(yd.getDate()-1);
  const y=yd.toISOString().split('T')[0];
  if(ds===t) return 'วันนี้';
  if(ds===y) return 'เมื่อวาน';
  const d=new Date(ds+'T00:00:00');
  const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${d.getDate()} ${M[d.getMonth()]}`;
}

function dayAbbr(ds){
  const d=new Date(ds+'T00:00:00');
  return ['อา','จ','อ','พ','พฤ','ศ','ส'][d.getDay()];
}

function thaiDate(){
  const d=new Date();
  const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()+543}`;
}

function greet(){
  const h=new Date().getHours();
  if(h>=5  && h<12) return 'สวัสดีตอนเช้า';
  if(h>=12 && h<17) return 'สวัสดีตอนบ่าย';
  if(h>=17 && h<21) return 'สวัสดีตอนเย็น';
  return 'สวัสดีตอนดึก';
}

/* ══════════════════════════════════════════════
   CORE CALC
══════════════════════════════════════════════ */
function C(){
  const bal = fN(S.balance), req = fN(S.reqSavings);
  const days = S.salaryDate ? daysUntil(S.salaryDate)
             : fN(S.manualDays)||0;
  const tgt  = fN(S.targetDaily);
  const useTgt = S.targetDaily.trim()!=='' && tgt>0;
  const spend  = bal - req;
  const daily  = days>0 ? spend/days : 0;
  const weekly = daily*7;
  const totSp  = useTgt ? tgt*days : 0;
  const remBuf = useTgt ? spend-totSp : 0;
  const dLast  = useTgt&&tgt>0 ? spend/tgt : 0;
  const hasData = S.balance!=='' || S.reqSavings!=='' || S.salaryDate!=='' || S.manualDays!=='';
  return {bal,req,days,tgt,useTgt,spend,daily,weekly,totSp,remBuf,dLast,hasData};
}

function T(){
  const c = C();
  const total  = S.entries.reduce((a,e)=>a+e.amount,0);
  const rem    = c.spend - total;
  const td     = todayISO();
  const tdSpent= S.entries.filter(e=>e.date===td).reduce((a,e)=>a+e.amount,0);
  const tdPct  = c.daily>0 ? clamp((tdSpent/c.daily)*100,0,120) : 0;

  // days remaining (auto-adjust if started tracking)
  let drem = c.days;
  if(S.trackerStart && c.days>0){
    const st=new Date(S.trackerStart+'T00:00:00');
    const now=new Date(); now.setHours(0,0,0,0);
    drem=Math.max(1, c.days - Math.floor((now-st)/86400000));
  }
  const newDaily = drem>0 ? rem/drem : 0;

  const uniq   = [...new Set(S.entries.map(e=>e.date))].length;
  const avg    = uniq>0 ? total/uniq : 0;
  let trend='neutral';
  if(avg>0) trend=avg<=c.daily*0.88?'under':avg<=c.daily*1.12?'ontrack':'over';

  return {...c,total,rem,tdSpent,tdPct,drem,newDaily,avg,trend,uniq};
}

function safety(rem,spend,useT){
  if(!useT||spend<=0) return null;
  if(rem<0) return 'over';
  const r=rem/spend;
  return r>0.30?'safe':r>0.12?'tight':'risky';
}

function modes(daily){
  if(daily<=0) return {s:150,c:200,f:300};
  return{
    s:Math.max(50,  rnd(daily*.55, daily>500?50:25)),
    c:Math.max(100, rnd(daily*.80, daily>500?50:25)),
    f:Math.max(150, rnd(daily*1.0, daily>500?100:10)),
  };
}

        <div class="fl"><span class="ic">${ic('calendar')}</span>วันที่เงินเดือนเข้า</div>
        <input id="inp-salaryDate" class="fi-inp sm${S.salaryDate?' has-value':''}" type="date" value="${S.salaryDate}"
          oninput="S.salaryDate=this.value;ss();uCalcOut()"/>
      </div>
      <div id="salary-days-badge">${autoD>0?`<div class="fi-days-badge">อีก ${autoD} วัน</div>`:''}</div>
    </div>
    <div class="fi">
      <div class="fm">
        <div class="fl"><span class="ic">${ic('hash')}</span>หรือกรอกวันเอง<span class="opt">ถ้าไม่รู้วันที่</span></div>
        <input id="inp-manualDays" class="fi-inp" type="number" value="${S.manualDays}" placeholder="จำนวนวัน" inputmode="numeric"
          oninput="S.manualDays=this.value;ss();uCalcOut()"/>
      </div><div class="fu">วัน</div>
    </div>
    <div class="fi">
      <div class="fm">
        <div class="fl"><span class="ic">${ic('target')}</span>เป้าใช้จ่าย/วัน<span class="opt">ไม่บังคับ</span></div>
        <input id="inp-targetDaily" class="fi-inp" type="number" value="${S.targetDaily}" placeholder="กรอกหรือกดโหมดด้านล่าง" inputmode="decimal"
          oninput="S.targetDaily=this.value;ss();uCalcOut()"/>
      </div><div class="fu">บาท</div>
    </div>
  </div>
  </div>
  <div id="calc-out"></div>
  </div>`;
  el.innerHTML=h;
  uCalcOut();
  bindDatePicker();
}

function uCalcOut(){
  const el=$('calc-out');
  if(!el){ rCalc(); return; }
  // Update dynamic parts of the form without re-rendering inputs
  const autoD=S.salaryDate?daysUntil(S.salaryDate):0;
  const badge=$('salary-days-badge');
  if(badge) badge.innerHTML=autoD>0?`<div class="fi-days-badge">อีก ${autoD} วัน</div>`:'';
  const sdInp=$('inp-salaryDate');
  if(sdInp) sdInp.classList.toggle('has-value', !!S.salaryDate);
  const c=C();
  const slv=safety(c.remBuf,c.spend,c.useTgt);
  const M=modes(c.daily);
  const am=c.useTgt
    ?(Math.abs(c.tgt-M.s)<=2?'s':Math.abs(c.tgt-M.c)<=2?'c':Math.abs(c.tgt-M.f)<=2?'f':null)
    :null;
  const dDays=c.days;
  const mDays=v=>v>0&&c.spend>0?(c.spend/v).toFixed(1):'—';
  const tlPct=dDays>0?clamp((c.dLast/dDays)*100,0,100):100;
  const tlCol=!c.useTgt?'var(--vc)':slv==='safe'?'var(--g)':slv==='tight'?'var(--a)':slv==='risky'?'var(--o)':'var(--r)';
  const bkPct=c.spend>0?clamp((c.totSp/c.spend)*100,0,120):0;
  const bkCol=bkPct<=70?'var(--g)':bkPct<=90?'var(--a)':'var(--r)';
  const spC=c.spend<0?'neg':''; const bufC=!c.useTgt?'':c.remBuf>=0?(c.remBuf/c.spend>0.3?'pos':'war'):'neg';
  let h='';
  if(c.hasData){
    if(slv){ const sv=SAFE_CFG[slv];
      h+=`<div class="sh">สถานะแผน</div>
      <div class="sb ${sv.cls}">
        <span class="sb-ico">${ic(sv.ico)}</span>
        <div class="sb-b"><div class="sb-t">${sv.h}</div><div class="sb-s">${sv.s}</div></div>
        <span class="sb-badge">${sv.badge}</span>
      </div>`;
    }
    h+=`<div class="sh">ผลการคำนวณ</div>
    <div class="hc">
      <div class="hc-lbl">${ic('calendar')} งบประมาณแนะนำต่อวัน</div>
      <div class="hc-val">${dDays>0&&c.spend>0?fmt(c.daily):'—'}<span class="cu">฿</span></div>
      <div class="hc-foot">
        <div class="hf"><div class="v">${fmt(c.spend)}</div><div class="l">ใช้ได้ทั้งหมด</div></div>
        <div class="hf-d"></div>
        <div class="hf"><div class="v">${dDays||'—'}</div><div class="l">วันจนเงินเดือน</div></div>
        <div class="hf-d"></div>
        <div class="hf"><div class="v">${dDays>0&&c.spend>0?fW(c.weekly):'—'}</div><div class="l">฿/สัปดาห์</div></div>
      </div>
    </div>`;
    h+=`<div class="g2" style="margin-top:10px">
      <div class="sc">
        <div class="sc-lbl">${ic('wallet')} เงินใช้ได้</div>
        <div class="sc-val ${spC}">${c.spend<0?'-':''}${fmt(Math.abs(c.spend))}<span class="u">฿</span></div>
        <div class="sc-sub">${fmt(c.bal)} − ${fmt(c.req)}</div>
      </div>
      ${c.useTgt
        ?`<div class="sc">
            <div class="sc-lbl">${ic('shield')} เงินสำรอง</div>
            <div class="sc-val ${bufC}">${c.remBuf<0?'-':''}${fmt(Math.abs(c.remBuf))}<span class="u">฿</span></div>
            <div class="sc-sub">${c.remBuf>=0?'เหลือก่อนเงินเดือน':'ขาดเงิน!'}</div>
          </div>`
        :`<div class="sc">
            <div class="sc-lbl">${ic('calendar')} วันที่เหลือ</div>
            <div class="sc-val">${dDays||'—'}<span class="u">วัน</span></div>
            <div class="sc-sub">จนถึงวันเงินเดือน</div>
          </div>`}
    </div>`;
    if(dDays>0&&c.spend>0){
      h+=`<div class="sh">โหมดการใช้จ่าย</div>
      <div class="mg">
        <button class="mb ms ${am==='s'?'on':''}" onclick="setTgt(${M.s})">
          <div class="mi">${ic('leaf')}</div><div class="mn">ประหยัด</div>
          <div class="mv">฿${fW(M.s)}</div><div class="ms2">พอ ${mDays(M.s)} วัน</div>
        </button>
        <button class="mb mc ${am==='c'?'on':''}" onclick="setTgt(${M.c})">
          <div class="mi">${ic('scale')}</div><div class="mn">สมดุล</div>
          <div class="mv">฿${fW(M.c)}</div><div class="ms2">พอ ${mDays(M.c)} วัน</div>
        </button>
        <button class="mb mf ${am==='f'?'on':''}" onclick="setTgt(${M.f})">
          <div class="mi">${ic('smile')}</div><div class="mn">ปกติ</div>
          <div class="mv">฿${fW(M.f)}</div><div class="ms2">พอ ${mDays(M.f)} วัน</div>
        </button>
      </div>`;
    }
    if(c.useTgt&&dDays>0){
      const ok=c.dLast>=dDays?'ok':c.dLast>=dDays*.75?'war':'bad';
      const oTxt=c.dLast>=dDays?ic('check')+' เงินพอ':c.dLast>=dDays*.75?ic('alert')+' เกือบไม่พอ':ic('x')+' เงินไม่พอ';
      h+=`<div class="sh">จำลองการใช้เงิน</div>
      <div class="sc" style="padding:16px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <span style="font-size:.8rem;font-weight:700;color:var(--t2)">ถ้าใช้ ${fW(c.tgt)} ฿/วัน</span>
          <span class="pill ${ok}">${oTxt}</span>
        </div>
        <div class="pt" style="height:9px"><div class="pf" style="width:${tlPct}%;height:9px;background:${tlCol}"></div></div>
        <div style="display:flex;justify-content:space-between;margin:5px 0 10px">
          <span style="font-size:.72rem;color:var(--t3)">วันนี้</span>
          <span style="font-size:.74rem;color:${tlCol};font-weight:700">พอ ${c.dLast.toFixed(1)} วัน / ${dDays} วัน</span>
          <span style="font-size:.72rem;color:var(--t3)">เงินเดือน</span>
        </div>
        <div class="g2">
          <div><div style="font-size:.74rem;color:var(--t2);margin-bottom:3px">รวมใช้จ่าย</div>
            <div style="font-size:1.2rem;font-weight:700;color:var(--t1)">${fmt(c.totSp,0)}<span style="font-size:.74rem;opacity:.5;margin-left:2px">฿</span></div></div>
          <div><div style="font-size:.74rem;color:var(--t2);margin-bottom:3px">% ที่ใช้ไป</div>
            <div style="font-size:1.2rem;font-weight:700;color:${bkCol}">${c.spend>0?bkPct.toFixed(1):'—'}<span style="font-size:.74rem;opacity:.5;margin-left:1px">%</span></div></div>
        </div>
      </div>`;
    }
    if(c.useTgt&&slv==='over'){
      const sh=Math.abs(c.remBuf), cut=dDays>0?sh/dDays:0;
      h+=`<div class="wb">
        <div class="wb-i">${ic('alert-oct')}</div>
        <div>
          <div class="wb-h">เงินไม่พอถึงวันเงินเดือน!</div>
          <div class="wb-b">จะขาด <strong style="color:var(--r)">${fmt(sh)} ฿</strong> — ต้องลดลง <strong style="color:var(--r)">${fmt(cut)} ฿/วัน</strong><br>หรือใช้ไม่เกิน <strong style="color:var(--r)">${fmt(c.tgt-cut)} ฿/วัน</strong></div>
        </div>
      </div>`;
    }
  }
  h+=`<div class="sh" style="margin-top:18px"></div>
  <button class="ghost" onclick="resetCalc()">${ic('reset')} รีเซ็ตตัวเลขทั้งหมด</button>
  <div style="height:8px"></div>`;
  el.innerHTML=h;
  renderHdr();
}

/* ══════════════════════════════════════════════
   RENDER: TRACKER
══════════════════════════════════════════════ */
function rTrack(){
  const t=T(), el=$('p-track');
  const Tr=TREND_CFG[t.trend];

  if(!t.hasData){
    el.innerHTML=`<div class="w"><div style="padding:24px 0">
      <div class="setup">
        <span class="setup-ico">${ic('sliders')}</span><div class="setup-h">ตั้งค่าการเงินก่อน</div>
        <div class="setup-s">กรอกข้อมูลในแท็บ คำนวณ<br>เพื่อเริ่มติดตามการใช้จ่าย</div>
        <button class="setup-btn" onclick="go('calc')">ไปที่ คำนวณ →</button>
      </div></div></div>`;
    return;
  }

  const remC=t.rem>=0?(t.rem/t.spend>0.3?'pos':'war'):'neg';
  const tdC =t.tdPct<=80?'var(--g)':t.tdPct<=100?'var(--a)':'var(--r)';
  const tdOv=t.tdSpent - t.daily;

  let h=`<div class="w">`;

  // Status
  h+=`<div class="sh sh-first">สถานะงบประมาณ</div>
  <div class="g3">
    <div class="sc">
      <div class="sc-lbl">เงินเหลือ</div>
      <div class="sc-val lg ${remC}">${t.rem<0?'-':''}${fmt(Math.abs(t.rem),0)}</div>
      <div class="sc-sub">฿ รวม</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">วันที่เหลือ</div>
      <div class="sc-val lg">${t.drem}</div>
      <div class="sc-sub">วัน</div>
    </div>
    <div class="sc hi">
      <div class="sc-lbl">งบใหม่/วัน</div>
      <div class="sc-val lg acc">${t.drem>0?fW(t.newDaily):'—'}</div>
      <div class="sc-sub">฿</div>
    </div>
  </div>`;

  // Trend
  h+=`<div class="tc ${Tr.cls}">
    <span class="tc-i">${ic(Tr.ico)}</span>
    <div class="tc-b">
      <div class="tc-h">${Tr.h}</div>
      <div class="tc-s">${Tr.s}${t.avg>0?` · เฉลี่ย <strong>${fmt(t.avg,0)} ฿/วัน</strong>`:''}</div>
    </div>
    <span class="tc-badge">${Tr.badge}</span>
  </div>`;

  // Log form
  h+=`<div class="sh">บันทึกค่าใช้จ่าย</div>
  <div class="lc">
    <div class="la">
      <input class="la-inp" type="number" id="la" placeholder="0" inputmode="decimal" min="0"
        onkeydown="if(event.key==='Enter')logS()"/>
      <div class="fu">฿</div>
    </div>
    <div class="ln">
      <span style="flex-shrink:0;color:var(--t3);display:flex;font-size:1rem">${ic('pencil')}</span>
      <input class="ln-inp" type="text" id="ln" placeholder="บันทึกย่อ เช่น ข้าวกลางวัน กาแฟ..."
        onkeydown="if(event.key==='Enter')logS()"/>
    </div>
    <div class="lp">
      <label class="lp-btn">${ic('camera')}<span id="lp-txt">แนบรูปใบเสร็จ</span>
        <input type="file" accept="image/*" id="lp-inp" onchange="pickPhoto(this)" hidden/></label>
      <div id="lp-prev"></div>
    </div>
    <button class="log-btn" onclick="logS()">${ic('plus')} บันทึก</button>
  </div>`;

  // Today card
  if(t.daily>0){
    const pct=clamp(t.tdPct,0,100);
    h+=`<div class="tdc">
      <div class="td-hdr">
        <span style="font-size:.8rem;font-weight:700;color:var(--t2)">${ic('calendar')} วันนี้</span>
        <span style="font-size:.76rem;color:var(--t3)">${labelDate(todayISO())}</span>
      </div>
      <div class="pt" style="height:8px"><div class="pf" style="width:${pct}%;height:8px;background:${tdC}"></div></div>
      <div class="td-row">
        <span style="font-size:1.3rem;font-weight:700;color:var(--t1)">${fmt(t.tdSpent,0)}<span style="font-size:.76rem;opacity:.5;margin-left:3px">฿</span></span>
        ${tdOv>0.5?`<span class="td-tag over">เกิน ${fW(tdOv)} ฿</span>`
          :tdOv<-0.5?`<span class="td-tag ok">ประหยัด ${fW(-tdOv)} ฿</span>`
          :t.tdSpent>0?`<span class="td-tag eq">ตามแผน</span>`
          :`<span style="font-size:.76rem;color:var(--t3)">ยังไม่มีรายการ</span>`}
      </div>
      <div style="font-size:.76rem;color:var(--t3);margin-top:5px">งบวันนี้ <strong style="color:var(--t1)">${fmt(t.daily,0)} ฿</strong></div>
    </div>`;
  }

  // History
  if(S.entries.length){
    h+=`<div class="sh">ประวัติ</div>`;
    const grp={};
    S.entries.forEach(e=>{if(!grp[e.date])grp[e.date]=[];grp[e.date].push(e);});
    Object.keys(grp).sort((a,b)=>b.localeCompare(a)).forEach(ds=>{
      const es=grp[ds], dt=es.reduce((a,e)=>a+e.amount,0);
      const onBudget=t.daily>0&&dt<=t.daily;
      h+=`<div class="hd">
        <div class="hd-hdr">
          <span class="hd-lbl">${labelDate(ds)}</span>
          <span class="hd-tot">${fmt(dt,0)} ฿ ${t.daily>0?(onBudget?'· <span style="color:var(--g)">ในงบ</span>':'· <span style="color:var(--r)">เกินงบ</span>'):''}</span>
        </div>`;
      es.forEach(e=>{
        h+=`<div class="he">
          <span class="he-tm">${e.ts||''}</span>
          <span class="he-nt ${!e.note?'em':''}">${e.note||'(ไม่มีบันทึก)'}</span>
          ${e.photo?`<button class="he-ph" aria-label="ดูรูปใบเสร็จ" onclick="openPhoto(${e.id})">${ic('image')}</button>`:''}
          <span class="he-am">${fmt(e.amount)} ฿</span>
          <button class="he-dl" aria-label="ลบรายการ" onclick="delE(${e.id})">${ic('x')}</button>
        </div>`;
      });
      h+=`</div>`;
    });
  } else {
    h+=`<div class="empty"><span class="empty-i">${ic('receipt')}</span><p>ยังไม่มีรายการ<br>เริ่มบันทึกค่าใช้จ่ายแรกได้เลย</p></div>`;
  }

  h+=S.entries.length
    ?`<button class="ghost" onclick="resetTrack()">${ic('trash')} ล้างประวัติทั้งหมด</button>`:'';
  h+=`<div style="height:8px"></div></div>`;
  el.innerHTML=h;
  showPick();
}

/* ══════════════════════════════════════════════
   RENDER: INSIGHTS
══════════════════════════════════════════════ */
function rInsights(){
  const c=C(), el=$('p-insights');
  if(!S.entries.length){
    el.innerHTML=`<div class="w"><div style="padding:28px 0">
      <div class="setup">
        <span class="setup-ico">${ic('chart')}</span><div class="setup-h">ยังไม่มีข้อมูล</div>
        <div class="setup-s">บันทึกค่าใช้จ่ายในแท็บ ติดตาม<br>เพื่อดูการวิเคราะห์การใช้เงิน</div>
        <button class="setup-btn" onclick="go('track')">ไปบันทึกเลย →</button>
      </div></div></div>`;
    return;
  }

  // Compute
  const total   = S.entries.reduce((a,e)=>a+e.amount,0);
  const uniq    = [...new Set(S.entries.map(e=>e.date))];
  const avg     = uniq.length>0?total/uniq.length:0;
  const onBudg  = c.daily>0?uniq.filter(ds=>{
    const dt=S.entries.filter(e=>e.date===ds).reduce((a,e)=>a+e.amount,0);
    return dt<=c.daily;
  }).length:0;
  const adh     = uniq.length>0?(onBudg/uniq.length)*100:0;

  // Streak (consecutive days under budget going back from today)
  let streak=0;
  const nd=new Date();
  for(let i=0;i<60;i++){
    const ds=nd.toISOString().split('T')[0];
    const dt=S.entries.filter(e=>e.date===ds).reduce((a,e)=>a+e.amount,0);
    if(dt===0&&i>0) break;
    if(dt>0&&c.daily>0){if(dt<=c.daily)streak++;else break;}
    nd.setDate(nd.getDate()-1);
  }

  // Month total
  const now=new Date(); const mon=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const monTotal=S.entries.filter(e=>e.date.startsWith(mon)).reduce((a,e)=>a+e.amount,0);

  // Biggest
  const big=S.entries.reduce((a,e)=>e.amount>a.amount?e:a,S.entries[0]);

  // 7-day chart
  const d7=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const spent=S.entries.filter(e=>e.date===ds).reduce((a,e)=>a+e.amount,0);
    d7.push({ds,spent,abbr:dayAbbr(ds),isToday:ds===todayISO()});
  }
  const maxSp=Math.max(...d7.map(d=>d.spent),c.daily||1,1);

  let h=`<div class="w">`;

  // Stats grid
  h+=`<div class="sh sh-first">สรุปภาพรวม</div>
  <div class="g2">
    <div class="sc">
      <div class="sc-lbl">${ic('line-chart')} เฉลี่ย/วัน</div>
      <div class="sc-val ${c.daily>0?(avg<=c.daily?'pos':'neg'):''}">${fmt(avg,0)}</div>
      <div class="sc-sub">฿/วัน · ${uniq.length} วันที่บันทึก</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">${ic('target')} อยู่ในงบ</div>
      <div class="sc-val ${adh>=70?'pos':adh>=40?'war':'neg'}">${adh.toFixed(0)}<span class="u">%</span></div>
      <div class="sc-sub">${onBudg} จาก ${uniq.length} วัน</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">${ic('flame')} ต่อเนื่อง</div>
      <div class="sc-val ${streak>=3?'pos':streak>=1?'war':''}">${streak}</div>
      <div class="sc-sub">วันในงบติดกัน</div>
    </div>
    <div class="sc">
      <div class="sc-lbl">${ic('calendar')} เดือนนี้</div>
      <div class="sc-val">${fmt(monTotal,0)}</div>
      <div class="sc-sub">฿ รวม</div>
    </div>
  </div>`;

  // 7-day chart
  h+=`<div class="sh">7 วันที่ผ่านมา</div>
  <div class="chart-wrap">
    <div class="chart-top">
      <span class="chart-title">การใช้จ่ายรายวัน</span>
      <div class="chart-legend">
        <div class="cl-item"><div class="cl-dot" style="background:var(--g)"></div>ในงบ</div>
        <div class="cl-item"><div class="cl-dot" style="background:var(--r)"></div>เกินงบ</div>
      </div>
    </div>
    <div class="chart-bars">`;
  d7.forEach(d=>{
    const hPct=d.spent>0?Math.max(3,(d.spent/maxSp)*100):0;
    const col=d.spent===0?'rgba(255,255,255,.07)':c.daily>0?(d.spent<=c.daily?'var(--g)':d.spent<=c.daily*1.2?'var(--a)':'var(--r)'):'var(--vc)';
    h+=`<div class="chart-col">
      <div class="chart-bar-val">${d.spent>0?fmt(d.spent,0):''}</div>
      <div class="chart-bar" style="height:calc(${(hPct/100).toFixed(4)} * (100% - 39px));background:${col}"></div>

  });
  // Budget line
  if(c.daily>0){
    const lp=clamp((c.daily/maxSp)*100,5,95);
    h+=`<div class="budget-line-wrap" style="bottom:calc(22px + ${(lp/100).toFixed(4)} * (100% - 39px))">
      <div class="budget-line"><span>งบ ${fW(c.daily)}</span></div>

  }
  h+=`</div></div>`;

  // Biggest expense
  h+=`<div class="sh">จุดสังเกต</div>
  <div class="sc" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:.76rem;font-weight:700;color:var(--t2);margin-bottom:4px">${ic('arrow-up-right')} รายจ่ายสูงสุด</div>
        <div style="font-size:.85rem;color:var(--t1);font-weight:600">${big.note||'(ไม่มีบันทึก)'}</div>
        <div style="font-size:.72rem;color:var(--t3);margin-top:2px">${labelDate(big.date)}</div>
      </div>
      <div style="font-size:1.5rem;font-weight:700;color:var(--r)">${fmt(big.amount,0)} ฿</div>
    </div>
  </div>`;

  // Pace insight
  if(c.spend>0&&avg>0){
    const remD=Math.max(1,c.days-uniq.length);
    const proj=total+(avg*remD);
    const projRemain=c.spend-proj;
    const ok=projRemain>=0;
    h+=`<div class="tip ${ok?'good':'bad'}">
      <span class="tip-i">${ic(ok?'bulb':'alert')}</span>
      <div class="tip-t">
        ${ok
          ?`ตามอัตราการใช้จ่ายปัจจุบัน คาดว่าจะมีเงินเหลือ <strong>${fmt(projRemain,0)} ฿</strong> ก่อนเงินเดือนเข้า`
          :`หากใช้จ่ายอัตรานี้ต่อไป เงินอาจ<strong>ไม่พอก่อนเงินเดือน</strong> — ควรลดลง <strong>${fmt(avg-c.daily,0)} ฿/วัน</strong>`}
      </div>
    </div>`;
  }

  h+=`<div style="height:8px"></div></div>`;
  el.innerHTML=h;
}

/* แผนเงินเดือนตามหลัก 50/30/20 + เงินฉุกเฉิน 6 เดือนของค่าใช้จ่ายจำเป็น
   ระหว่างที่เงินฉุกเฉินยังไม่ครบ ส่วนออม 20% แบ่งครึ่งไปเติมเงินฉุกเฉิน */
function plan(){
  const sal=fN(S.salary), ef=fN(S.emergencySaved);
  const needs=sal*.5, wants=sal*.3, save=sal*.2;
  const efTarget=needs*6, efFull=sal>0&&ef>=efTarget;
  const emergency=efFull?0:save/2, savings=save-emergency;
  const months=emergency>0?Math.ceil((efTarget-ef)/emergency):0;
  return {sal,ef,needs,wants,save,efTarget,efFull,emergency,savings,months,daily:(needs+wants)/30};
}

function uPlan(){
  const el=$('plan-out');
  if(!el) return;
  const P=plan();
  if(P.sal<=0){
    el.innerHTML=`<div class="tip">

    </div>`;
    return;
  }
  const pc=v=>Math.round(v/P.sal*100);
  const row=(col,nm,ds,v)=>`<div class="plan-row">

      <div class="plan-tx"><div class="plan-nm">${nm}</div><div class="plan-ds">${ds}</div></div>
      <div class="plan-am"><div class="plan-v">${fW(v)} ฿</div><div class="plan-pc">${pc(v)}% · ต่อเดือน</div></div>
    </div>`;
  const goalSet=Math.round(fN(S.savingGoal))===Math.round(P.save*12);
  let h=`<div class="plan">
    <div class="plan-bar">
      <span style="flex:50;background:var(--vc)"></span>
      <span style="flex:30;background:var(--bl)"></span>

    </div>
    ${row('var(--vc)','ใช้จ่ายจำเป็น','ค่าเช่า อาหาร เดินทาง ค่าน้ำไฟ หนี้',P.needs)}
    ${row('var(--bl)','ใช้ส่วนตัว','กินเที่ยว ช้อปปิ้ง งานอดิเรก',P.wants)}
    ${P.emergency>0?row('var(--a)','เงินฉุกเฉิน','เก็บแยกไว้ยามป่วย ตกงาน ซ่อมรถ',P.emergency):''}
    ${row('var(--g)','ออม / ลงทุน','เก็บเพื่อเป้าหมายระยะยาว',P.savings)}
    <div class="plan-foot">ใช้จ่ายได้ประมาณ <strong>วันละ ${fW(P.daily)} ฿</strong> (จำเป็น + ส่วนตัว ÷ 30 วัน)</div>
  </div>`;
  const efPct=P.efTarget>0?clamp(P.ef/P.efTarget*100,0,100):0;
  h+=`<div class="sc" style="margin-top:10px;padding:15px 16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px">

      <span style="font-size:.95rem;font-weight:700;color:var(--t1)">${fW(P.efTarget)} ฿</span>
    </div>
    <div class="pt" style="height:9px"><div class="pf" style="width:${efPct}%;height:9px;background:${P.efFull?'var(--g)':'var(--a)'}"></div></div>
    <div style="font-size:.8rem;color:var(--t2);margin-top:8px;line-height:1.55">${P.efFull
      ?`มีครบแล้ว ${fW(P.ef)} ฿ ส่วนออม 20% ไปออม/ลงทุนได้ทั้งหมด`
      :`มีแล้ว ${fW(P.ef)} ฿ · ถ้าเก็บเดือนละ ${fW(P.emergency)} ฿ จะครบในอีกประมาณ <strong style="color:var(--t1)">${P.months} เดือน</strong>`}</div>
  </div>
  <button class="plan-btn ${goalSet?'done':''}" ${goalSet?'disabled':''} onclick="usePlanGoal()">${goalSet
    ?`${ic('check')} เป้าเงินเก็บ/ปีตรงกับแผนแล้ว`

  let out=`<div class="sh">เพิ่มยอดออมเร็วๆ</div>
  <div class="qa">

  if(sg>0){
    out+=`<div class="sh">ไมล์สโตน</div>

  if(sg>0&&!over){

}

/* Date picker binding for mobile — บังคับเปิดปฏิทินเมื่อ tap */
function bindDatePicker(){
  const inp = $('inp-salaryDate');
  if(!inp || inp._dpBound) return;
  inp._dpBound = true;

  const openPicker = () => {
    try{
      if(typeof inp.showPicker === 'function'){
        inp.showPicker();
      }
    }catch(_){
      // ถ้า showPicker ไม่ได้รับ user gesture หรือไม่รองรับ ก็ปล่อยให้ native click ทำงาน
    }
  };

  // tap ที่ตัว input → เปิดปฏิทิน
  inp.addEventListener('click', openPicker);

  // tap ที่ label / ไอคอน 📅 / พื้นที่ว่างในแถว → focus input แล้วเปิดปฏิทิน
  const row = $('fi-salary-row');
  if(row){
    row.addEventListener('click', (e) => {
      if(e.target === inp) return;                       // input คลิกเองอยู่แล้ว
      if(e.target.closest('#salary-days-badge')) return; // ไม่ trigger จาก badge
      e.preventDefault();
      inp.focus();
      openPicker();
    });
  }
}

async function logS(){
  const amt=parseFloat($('la')?.value);
  if(isNaN(amt)||amt<=0){
    const i=$('la'); if(i){i.style.outline='2px solid var(--r)';setTimeout(()=>i.style.outline='',900);}
    return;
  }
  const note=$('ln')?.value.trim()||'';
  const ds=todayISO();
  if(!S.trackerStart) S.trackerStart=ds;
  const entry={
    id:Date.now(), date:ds, amount:amt, note,
    ts:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
  };
  if(pendingPhoto){
    try{ await putPhoto(entry.id,pendingPhoto); entry.photo=true; pendingPhoto=null; }
    catch(e){ alert('เก็บรูปไม่สำเร็จ รายการนี้จะบันทึกโดยไม่มีรูป'); }
  }
  S.entries.unshift(entry);
  ss(); queueSync(entry.id,'upsert'); ra();
}

function delE(id){
  const e=S.entries.find(x=>x.id===id);
  S.entries=S.entries.filter(e=>e.id!==id);
  if(e&&e.photo){
    delPhoto(id).catch(()=>{});
    if(SY.photoFiles[id]){ SY.photoTrash.push(SY.photoFiles[id]); delete SY.photoFiles[id]; sySave(); }
  }
  ss(); queueSync(id,'delete'); ra();
}

// ล้างประวัติเพื่อเริ่มรอบใหม่: ในแอปหายหมด แต่ใน Google Sheets และรูปใน Drive ยังเก็บไว้เป็นหลักฐาน
async function resetTrack(){
  if(SY.url){
    await flushSync().catch(()=>{});
    const left=Object.keys(SY.outbox).length+photosWaiting();
    if(left>0&&!confirm(`ยังมี ${left} รายการ/รูปที่ยังส่งเข้า Google Sheets ไม่สำเร็จ ถ้าล้างตอนนี้จะไม่มีในชีต ล้างต่อไหม?`)) return;
  }
  if(!confirm(SY.url
    ?'ล้างประวัติการใช้จ่ายในแอปทั้งหมดใช่ไหม?\n(ข้อมูลใน Google Sheets ยังอยู่ครบ)'
    :'ล้างประวัติการใช้จ่ายทั้งหมดใช่ไหม?')) return;
  S.entries=[]; S.trackerStart=null;
  SY.outbox={}; SY.photoFiles={}; sySave();
  clearPhotos().catch(()=>{});
  ss(); ra();

function resetSav(){

function go(p){
  TAB=p;
  document.querySelectorAll('.pane').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('on'));
  $('p-'+p)?.classList.add('on');
  document.querySelector(`[data-p="${p}"]`)?.classList.add('on');
  $('content').scrollTo({top:0,behavior:'instant'});
  render(p);
}

function render(p){
  if(p==='home')     rHome();
  if(p==='calc')     rCalc();
  if(p==='track')    rTrack();
  if(p==='insights') rInsights();
  if(p==='savings')  rSavings();
  if(p==='settings') rSettings();
  renderHdr();
}

function ra(){ render(TAB); } // render all (current tab + hdr)

// ค่าการเชื่อมต่อเก็บแยกจากข้อมูลหลัก (bapp_v6) เพื่อไม่ให้รูปแบบข้อมูลเดิมเปลี่ยน
const SYK='bapp_sheet';
const SY_DFLT={url:'',lastSyncAt:null,outbox:{},photoFiles:{},photoTrash:[]};
let SY={...SY_DFLT};
let syncErr=false, photoErr=null, syncing=null, syncTimer=null, pendingPhoto=null, setMsg=null;

function sySave(){ try{ localStorage.setItem(SYK,JSON.stringify(SY)); }catch(e){} }
function syLoad(){ try{ const r=localStorage.getItem(SYK); if(r) SY={...SY_DFLT,...JSON.parse(r)}; }catch(e){} }

/* รูปใบเสร็จเก็บใน IndexedDB ของเครื่อง เป็นไบต์ + ชนิดไฟล์
   (iPhone เก็บ Blob ลง IndexedDB ไม่ได้เสมอไป) */
let photoDb=null;
function pdb(){
  if(!photoDb) photoDb=new Promise((res,rej)=>{
    const rq=indexedDB.open('bapp_photos',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('photos');
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
  return photoDb;
}
async function photoOp(mode,fn){
  const db=await pdb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('photos',mode), rq=fn(tx.objectStore('photos'));
    tx.oncomplete=()=>res(rq.result);
    tx.onerror=()=>rej(tx.error);
  });
}
async function putPhoto(id,blob){
  const bytes=await new Response(blob).arrayBuffer();
  return photoOp('readwrite',st=>st.put({type:blob.type||'image/jpeg',bytes},String(id)));
}
async function getPhoto(id){
  const v=await photoOp('readonly',st=>st.get(String(id)));
  return v?new Blob([v.bytes],{type:v.type}):null;
}
const delPhoto=id=>photoOp('readwrite',st=>st.delete(String(id)));
const clearPhotos=()=>photoOp('readwrite',st=>st.clear());

// ย่อรูปให้ด้านยาวไม่เกิน 1280px และบีบเป็น JPEG เพื่อไม่ให้กินพื้นที่เครื่อง
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.7));
    if(!blob) throw new Error('shrink');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

async function pickPhoto(inp){
  const f=inp.files&&inp.files[0]; inp.value='';
  if(!f) return;
  try{ pendingPhoto=await shrinkImage(f); }
  catch(e){ pendingPhoto=null; alert('เปิดรูปนี้ไม่ได้ ลองเลือกรูปอื่น'); }
  showPick();
}
function showPick(){
  const el=$('lp-prev'), t=$('lp-txt');
  if(!el) return;
  if(el._url){ URL.revokeObjectURL(el._url); el._url=null; }
  if(pendingPhoto){
    el._url=URL.createObjectURL(pendingPhoto);
    el.innerHTML=`<img src="${el._url}" alt="รูปที่แนบ"/><button aria-label="เอารูปออก" onclick="pendingPhoto=null;showPick()">${ic('x')}</button>`;
    t.textContent='เปลี่ยนรูป';
  } else { el.innerHTML=''; t.textContent='แนบรูปใบเสร็จ'; }
}

const driveUrl=id=>SY.photoFiles[id]?`https://drive.google.com/file/d/${SY.photoFiles[id]}/view`:'';
async function openPhoto(id){
  const img=$('vw-img'), empty=$('vw-empty'), a=$('vw-drive');
  let blob=null; try{ blob=await getPhoto(id); }catch(e){}
  if(img._url){ URL.revokeObjectURL(img._url); img._url=null; }
  if(blob){ img._url=URL.createObjectURL(blob); img.src=img._url; }
  img.hidden=!blob; empty.hidden=!!blob;
  const d=driveUrl(id); a.hidden=!d; if(d) a.href=d;
  $('viewer').hidden=false;
}
function closeViewer(){ $('viewer').hidden=true; }

/* ── ส่งเข้าชีต */
function sheetRow(e){
  return {
    id:String(e.id), date:e.date, time:e.ts||'', amount:e.amount, note:e.note||'',
    hasPhoto:!!e.photo, photoUrl:e.photo?driveUrl(e.id):'',
    createdAt:new Date(e.id).toISOString(),
  };
}
// สรุปตัวเลขล่าสุดจากหน้าคำนวณ/เงินเก็บ เขียนลงแท็บ "สรุปล่าสุด"
function sheetSummary(){
  const t=T(), P=plan();
  return [
    ['ยอดเงินในบัญชี (บาท)', fN(S.balance)],
    ['เงินเก็บ/ห้ามแตะ (บาท)', fN(S.reqSavings)],
    ['วันเงินเดือนเข้า', S.salaryDate||''],
    ['วันที่เหลือถึงเงินเดือน', t.drem||0],
    ['งบใช้ได้ต่อวัน (บาท)', Math.round(t.daily)],
    ['งบใหม่ต่อวัน หลังหักที่ใช้ไป (บาท)', Math.round(t.newDaily)],
    ['ใช้ไปแล้วรอบนี้ (บาท)', t.total],
    ['เงินคงเหลือก่อนเงินเดือน (บาท)', Math.round(t.rem)],
    ['เป้าเงินเก็บต่อปี (บาท)', fN(S.savingGoal)],
    ['ออมแล้ว (บาท)', fN(S.savedAmount)],
  ].concat(P.sal>0?[
    ['เงินเดือน (บาท)', P.sal],
    ['แผน 50/30/20: ใช้จ่ายจำเป็น/เดือน (บาท)', Math.round(P.needs)],
    ['แผน 50/30/20: ใช้ส่วนตัว/เดือน (บาท)', Math.round(P.wants)],
    ['แผน 50/30/20: เงินฉุกเฉิน/เดือน (บาท)', Math.round(P.emergency)],
    ['แผน 50/30/20: ออม/ลงทุน/เดือน (บาท)', Math.round(P.savings)],
    ['เงินฉุกเฉินที่มี (บาท)', P.ef],
    ['เป้าเงินฉุกเฉิน 6 เดือน (บาท)', Math.round(P.efTarget)],
  ]:[]);
}
async function send(payload,ms=20000){
  const ctl=new AbortController(), tm=setTimeout(()=>ctl.abort(),ms);
  try{
    // text/plain ส่งตรงไป Google ได้โดยไม่ต้องขออนุญาตล่วงหน้า (CORS preflight)
    const r=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),signal:ctl.signal});
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'sheet');
    return j;
  } finally { clearTimeout(tm); }
}
const blobB64=b=>new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>res(String(fr.result).split(',')[1]);
  fr.onerror=()=>rej(fr.error);
  fr.readAsDataURL(b);
});
const photosWaiting=()=>S.entries.filter(e=>e.photo&&!SY.photoFiles[e.id]).length;

function queueSync(id,op){
  if(!SY.url) return;
  SY.outbox[id]={op,at:Date.now()}; sySave(); syncSoon();
}
function syncSoon(ms=600){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>flushSync().catch(()=>{}),ms);
}
// ส่งทีละรอบ ถ้าเรียกซ้ำระหว่างส่ง จะส่งต่ออีกรอบหลังรอบนี้จบ
async function flushSync(){
  if(syncing){ await syncing.catch(()=>{}); return flushSync(); }
  syncing=runSync();
  try{ await syncing; } finally { syncing=null; }
}
async function sendOutbox(){
  const sent=Object.entries(SY.outbox);
  const byId=new Map(S.entries.map(e=>[String(e.id),e]));
  const ops=sent.map(([id,o])=>{
    const e=byId.get(id);
    return o.op==='upsert'&&e?{op:'upsert',row:sheetRow(e)}:{op:'delete',id};
  });
  await send({ops,summary:sheetSummary()});
  // ลบออกจากคิวเฉพาะรายการที่ไม่ได้ถูกแก้อีกระหว่างส่ง
  sent.forEach(([id,o])=>{ if(SY.outbox[id]&&SY.outbox[id].at===o.at) delete SY.outbox[id]; });
  SY.lastSyncAt=new Date().toISOString(); sySave();
}
async function syncPhotos(){
  let n=0;
  for(const e of S.entries){
    if(!e.photo||SY.photoFiles[e.id]) continue;
    const blob=await getPhoto(e.id);
    if(!blob) continue;
    const r=await send({action:'uploadPhoto',id:String(e.id),date:e.date,
      type:blob.type||'image/jpeg',data:await blobB64(blob)},60000);
    if(!r.fileId) throw new Error('unsupported');
    SY.photoFiles[e.id]=r.fileId;
    SY.outbox[e.id]={op:'upsert',at:Date.now()};   // อัปเดตแถวให้มีลิงก์รูป
    sySave(); n++;
  }
  if(SY.photoTrash.length){
    const tr=[...SY.photoTrash];
    await send({action:'trashPhotos',fileIds:tr});
    SY.photoTrash=SY.photoTrash.filter(f=>!tr.includes(f)); sySave();
  }
  return n;
}
async function runSync(){
  if(!SY.url) return;
  try{ await sendOutbox(); syncErr=false; if(setMsg&&!setMsg.err) setMsg=null; }
  catch(e){ syncErr=true; renderSync(); return; }
  // ส่งรูปไม่ได้ ไม่ทำให้การส่งรายการหยุด รูปจะลองส่งใหม่รอบหน้า
  try{ if(await syncPhotos()) await sendOutbox(); photoErr=null; }
  catch(e){ photoErr=e.message==='unsupported'?'unsupported':'failed'; }
  renderSync();
}

function syncState(){
  if(!SY.url) return 'off';
  const pend=Object.keys(SY.outbox).length, ph=photosWaiting();
  if((syncErr&&pend)||(photoErr&&ph)) return 'err';
  return pend||ph?'wait':'ok';
}
function renderSync(){
  const b=$('sync-btn');
  if(b){
    const st=syncState();
    b.classList.toggle('on',st!=='off');
    b.innerHTML=`${ic('cloud')}<span class="sync-dot ${st==='wait'||st==='err'?st:''}"></span>`;
  }
  if(TAB==='settings') rSettings();
}
function thaiDT(iso){
  return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function connectSheet(){
  const url=($('sheet-url')?.value||'').trim();
  if(!SHEET_URL_RE.test(url)){
    setMsg={err:true,t:'ลิงก์ไม่ถูกต้อง ต้องขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec'};
    return rSettings(url);
  }
  const btn=$('sheet-go'); if(btn){ btn.disabled=true; btn.textContent='กำลังเชื่อมต่อ...'; }
  try{
    const j=await (await fetch(url)).json();
    if(!j.ok||j.app!==APP_ID) throw new Error('not ours');
  }catch(e){
    setMsg={err:true,t:'เชื่อมต่อไม่ได้ ตรวจว่ามีเน็ต และตอนตั้งค่าใน Google เลือก "ทุกคน" (Anyone) ตามคู่มือ'};
    return rSettings(url);
  }
  SY={...SY_DFLT,url};
  S.entries.forEach(e=>{ SY.outbox[e.id]={op:'upsert',at:Date.now()}; });
  sySave(); setMsg={err:false,t:'เชื่อมต่อแล้ว กำลังส่งข้อมูลเข้าชีต...'};
  rSettings(); renderSync(); flushSync().catch(()=>{});
}
function resendAll(){
  S.entries.forEach(e=>{ SY.outbox[e.id]={op:'upsert',at:Date.now()}; });
  sySave(); setMsg=null; renderSync(); flushSync().catch(()=>{});
}
function disconnectSheet(){
  if(!confirm('เลิกเชื่อมต่อ Google Sheets?\n(ข้อมูลที่อยู่ในชีตและรูปใน Drive ยังอยู่ครบ)')) return;
  SY={...SY_DFLT}; sySave(); syncErr=false; photoErr=null; setMsg=null;
  renderSync(); rSettings();
}

function rSettings(typed=''){
  const el=$('p-settings');
  const msg=setMsg?`<div class="set-msg ${setMsg.err?'err':'ok'}">${setMsg.t}</div>`:'';
  let h=`<div class="w"><div class="sh sh-first">สำรองข้อมูลเข้า Google Sheets</div>`;
  if(!SY.url){
    h+=`<div class="sc" style="padding:18px 16px">
      <p class="set-p">ทุกครั้งที่จดรายจ่าย แอปจะส่งไปเก็บใน <strong>Google Sheets ของคุณเอง</strong> พร้อมลิงก์รูปใบเสร็จใน Google Drive ไว้ดูย้อนหลังและใช้เป็นหลักฐาน</p>
      <p class="set-p" style="margin-top:8px">ตั้งค่าครั้งเดียวบนคอมพิวเตอร์ ทำตาม<a class="set-link" href="${GUIDE_URL}" target="_blank" rel="noopener">คู่มือนี้</a> แล้วนำลิงก์ที่ได้มาวางด้านล่าง</p>
      <input id="sheet-url" class="set-inp" type="url" inputmode="url" autocomplete="off" spellcheck="false"
        placeholder="https://script.google.com/macros/s/.../exec" value="${typed.replace(/"/g,'&quot;')}"/>
      <button id="sheet-go" class="set-btn" onclick="connectSheet()">${ic('link')} เชื่อมต่อ</button>
      ${msg}
    </div>`;
  } else {
    const pend=Object.keys(SY.outbox).length, ph=photosWaiting();
    const withPh=S.entries.filter(e=>e.photo).length;
    const line=(cls,icon,t)=>`<div class="sync-line ${cls}">${ic(icon)}<span>${t}</span></div>`;
    let lines=line('', 'cloud', SY.lastSyncAt?`ส่งล่าสุดเมื่อ ${thaiDT(SY.lastSyncAt)}`:'ยังไม่ได้ส่ง');
    lines+=pend
      ?line(syncErr?'err':'wait', syncErr?'alert':'cloud', syncErr?`ยังส่งไม่สำเร็จ ${pend} รายการ จะลองใหม่เองเมื่อมีเน็ต`:`กำลังส่ง ${pend} รายการ`)
      :line('', 'check-circle', 'ส่งครบทุกรายการแล้ว');
    if(withPh){
      lines+=!ph?line('', 'image', `รูปใบเสร็จอยู่ใน Google Drive ครบ ${withPh} รูป`)
        :photoErr==='unsupported'?line('err','alert',`รูปยังส่งไม่ได้ ${ph} รูป ต้องอัปเดตโค้ดในชีตก่อน`)
        :photoErr||syncErr?line('err','alert',`รูปยังส่งไม่สำเร็จ ${ph} รูป จะลองใหม่เอง`)
        :line('wait','image',`กำลังส่งรูป ${ph} รูป`);
    }
    h+=`<div class="sc" style="padding:16px"><div class="sync-lines">${lines}</div>${msg}</div>
    <div class="tip" style="margin-top:10px"><span class="tip-i">${ic('bulb')}</span>
      <div class="tip-t">ชีตมี 2 แท็บ: <strong>รายจ่าย</strong> (ทุกรายการ พร้อมลิงก์รูป) และ <strong>สรุปล่าสุด</strong> (ยอดเงิน งบต่อวัน เงินเก็บ)<br>
      กด ${ic('x')} ลบรายการเดียว จะลบในชีตด้วย แต่ <strong>ล้างประวัติทั้งหมด</strong> ข้อมูลในชีตยังอยู่ครบ</div></div>
    <button class="set-btn" style="margin-top:12px" onclick="resendAll()">${ic('reset')} ส่งข้อมูลทั้งหมดอีกครั้ง</button>
    <div style="height:10px"></div>
    <button class="ghost" onclick="disconnectSheet()">เลิกเชื่อมต่อ</button>`;
  }
  h+=`<div style="height:8px"></div></div>`;
  el.innerHTML=h;
}

window.addEventListener('online',()=>syncSoon());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SY.url) syncSoon(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeViewer(); });
